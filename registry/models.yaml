  Qwen/Qwen3.8-Flash-Next:
    kind: text
    name:
      short: qwen3.8 flash next
      match: qwen\s*-?3\.8[\s-]*flash[\s-]*next|qwen3\.8-flash-next
    quant_sweep:
      url: https://unsloth.ai/docs/models/qwen3.8-next
      source: unsloth
      columns: [quant, gb, top1, kld, delta]
      note: ten rungs of mean kl divergence and top-1 agreement against bf16, published on
        unsloth's docs site rather than on the card. the rows are the page's own search index,
        so the layout above is declared rather than read off a header
    quants:
    - repo: unsloth/Qwen3.8-Flash-Next-GGUF
      quant: UD-IQ4_XS
      note: 'UD-IQ4_XS at 87.2gib rather than the UD-Q4_K_XL the viewer picks, and both fit --
        93.2 and 109.7 resident with their 262144 caches, against a 117gib host budget. what
        separates them is whether the model can SHARE the box: at 93.2 it hosts the ~20gib of
        companions a host keeps beside it, at 109.7 it does not and goes solo. what the step up
        buys is measured -- unsloth publishes top-1 agreement against bf16 for all ten rungs,
        89.554% here against 92.255% at UD-Q4_K_XL, so 16.4gib is worth 2.7 points of token
        agreement, and giving the box to one model. the tags overstate how
        far the ladder compresses: 41% of the model is an n-gram table whose 160-column rows take
        only block-32 types, so nothing goes below ~4.25 bits and UD-IQ1_S is 3.22 bpw at 67.6gib
        rather than anything like one. every rung is sharded 3-4 ways, and the card states
        sizes in decimal gb, so its figures read ~7% larger than the gib this registry sizes in'
    - repo: agentionai/Qwen3.8-Flash-Next-AP-GGUF
      quant: AP-Q4_K_XL
      note: 'a second ladder, six tiers of one unsharded file each, stated in gib that match the
        bytes measured here -- so unlike the unsloth card these figures need no conversion. the
        tier names are base ftype names and do NOT describe the experts, which the card says
        outright and which is the trap: AP-IQ4_XS at 84.24gib runs IQ3_S 3.44-bit experts, a rung
        BELOW the pinned unsloth file of the same name. AP-Q4_K_XL is the smallest published tier
        whose experts (Q4_K 4.5) sit at or above it, and the card''s own default: 94.20gib, 100.2
        resident with the 262144 cache, which lands inside the 16.4gib step unsloth leaves between
        UD-IQ4_XS and UD-Q4_K_XL and costs 9.5gib less than the latter -- but at 100.2 it takes
        the box solo, which is the trade the pinned UD-IQ4_XS exists to avoid. the tier that would
        match rung for rung, AP-IQ4_M at 88.04gib, is in the card table with no file in the repo.
        none of its quality figures can be read against unsloth''s: they are kl divergence and
        top-1 against bf16 on a held-out corpus, chosen because the n-gram table has memorised
        wikitext -- the card scores the same file 6.9-8.6 points higher on wikitext than off it
        and says the gap widens as the quant shrinks. read the download column, not the card''s
        vram column, which subtracts the 26.82gib n-gram table on the strength of -ot
        per_layer_token_embd=CPU -- that moves the table to system ram rather than removing it,
        and on a unified-memory host it removes nothing. the --ngram-on-disk, --ngram-io-threads,
        --ngram-cache and -mp/--model-ple the card runs on are not mainline flags; mainline marks
        per_layer_token_embd TENSOR_READ_LAZY and --lazy-mode defaults to auto, so a stock build
        already reads that table from disk a row at a time, for these files and unsloth''s alike.
        the gguf header carries unsloth''s patched template byte for byte rather than qwen''s, so
        the turns: block below is derived from the same jinja these files ship'
    runtime:
      arch: qwen4exp
      mainline: true
      since: b10660
      merged: '2026-08-27'
    ids:
      aa: qwen3-8-flash-next
      gbench: ''
      lmarena: qwen3.8-flash-next
      swerebench: ''
      epoch: ''
    sampling:
      thinking:
        source: quant-card
        temp: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repeat_penalty: 1.0
        tuned:
        - instruct
        - chat
        - reason
        - code
        - tools
        thinking: xhigh
      instruct:
        source: quant-card
        temp: 0.7
        top_p: 0.8
        top_k: 20
        min_p: 0.0
        presence_penalty: 1.5
        repeat_penalty: 1.0
        tuned:
        - instruct
        - chat
        - code
        - tools
        thinking: 'off'
    notes: 'the vendor''s 125b and the hub''s 180b are one model counted two ways: 125b of
      transformer with 6b active, plus a 51b n-gram embedding and a 4b mtp layer. the mtp layer
      does not survive conversion -- llama.cpp''s converter drops it, and this gguf''s header
      carries no nextn tensor and no nextn key -- so unlike qwen3.8-27b there is nothing in the
      repo to draft with, and llama.cpp PR 27836 is what would change that. vision arrived after
      the release rather than with it: unsloth published mmproj-F16 on 2026-08-27 and the repo
      was text-only for its first three days. qwen4exp support landed in llama.cpp on the same
      day, so a build older than that loads none of these files.'
    modalities:
      input:
      - text
      - image
      - video
      output:
      - text
    turns:
      source: unsloth/Qwen3.8-Flash-Next-GGUF
      developer: as-system
      leading_system_max: unlimited
      mid_system: rejected
      mid_developer: rejected
      upstream_differs: [developer, leading_system_max]
    thinking:
      knob: reasoning_effort
      gate: enable_thinking
      gate_default: true
      accepts: [low, medium, xhigh]
      default: xhigh
      aliases: {high: xhigh}
