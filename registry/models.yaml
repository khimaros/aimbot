  XiaomiMiMo/MiMo-V2.6-Flash-RL:
    kind: text
    name:
      short: mimo v2.6 flash
      match: mimo[\s-]*v?2\.6[\s-]*flash
    notes: >-
      the smaller of the two rl checkpoints of the 2.6 series, "the
      efficiency-balanced checkpoint" as the card {card} puts it: 309b of parameters
      with 15b live per token, 1m context, and text, image, video and audio into one
      backbone. one caveat before the figures: the hub counts this checkpoint's packed
      expert tensors once each, so the parameter total derived off it is about half the
      card's and any bits per weight computed from that total is double the file's. the
      tensor table read out of the two ggufs is right, and the notes on the rungs quote
      it.

      the scores are the vendor's and they are agentic ones, deepswe and terminal
      bench and osworld, because nothing on this roster has scored a model that is
      days old. ggml-org converted it the next day and is the only publisher of a
      gguf, which is why the two rungs below are its two files.
    quants:
    - repo: ggml-org/MiMo-V2.6-Flash-RL-GGUF
      quant: Q2_K
      note: '{gib} at {bpw}, the smaller of the two rungs and the smaller of the two files: the
        card {card} says it keeps the expert down projections at mxfp4 and puts the
        gate and up projections at Q2_K, and that "the Q2 models do not use an imatrix
        calibration due to lack of one"'
    - repo: ggml-org/MiMo-V2.6-Flash-RL-GGUF
      quant: MXFP4
      note: '{gib} at {bpw}: the routed experts at "their native MXFP4 precision" {card}
        with the rest at Q8_0, so what the smaller rung gives up is on the experts. the
        vision and audio encoders are a separate
        {gib@ggml-org/MiMo-V2.6-Flash-RL-GGUF:mmproj:Q8_0} mmproj'
    - repo: AesSedai/MiMo-V2.6-Flash-RL-GGUF
      quant: Q3_K
      note: '{gib} at {bpw}: the same trick as this block''s Q2_K at one notch up, its
        tensor table putting Q3_K over 65% of the weights and the routed experts at
        native MXFP4. the ladder runs down from here through the publisher''s own
        bits-per-weight mixes to {gib@AesSedai/MiMo-V2.6-Flash-RL-GGUF:BPW2.0}, and the
        repo carries a {gib@AesSedai/MiMo-V2.6-Flash-RL-GGUF:imatrix.gguf} calibration
        file, which is what ggml-org''s card says its Q2 rung went without, "due to
        lack of one" {card@ggml-org/MiMo-V2.6-Flash-RL-GGUF}'
    - repo: TrevorJS/MiMo-V2.6-Flash-RL-GGUF
      quant: IQ2_XS
      file: MiMo-V2.6-Flash-RL-IQ2_XS_M-v2.1.gguf
      note: '{gib} at {bpw} over ten shards, IQ2_XS on the bulk of the weights and IQ2_S
        on the rest, which puts it under this block''s Q2_K on bits and under every
        other rung here on size. what it carries that ggml-org does not is a drafter of
        the other school: a
        {gib@TrevorJS/MiMo-V2.6-Flash-RL-GGUF:dflash:Q8_0} DFlash file beside the
        weights, where ggml-org ships MTP
        {card@ggml-org/MiMo-V2.6-Flash-RL-GGUF}'
    runtime:
      arch: mimo2
      mainline: true
      since: b7536
      merged: '2025-12-24'
    ids:
      aa: ''
      gbench: xiaomi/mimo-v2.6-flash
      lmarena: ''
      swerebench: ''
      epoch: ''
      aa-stt: ''
      aa-stt-streaming: ''
      voicearena: ''
      open-asr: ''
    speculative:
      type: draft-mtp
      n_max: 7
      note: 'a sidecar and not a head folded into the weights: the conversion carries
        q8_0 and mxfp4 copies of the draft beside the rungs for `--mtp`
        {card@ggml-org/MiMo-V2.6-Flash-RL-GGUF}. the weights card {card} describes a "5-layer
        SWA MTP drafter (DFlash-style)" that "Predicts 7 subsequent tokens per forward pass",
        which is where n_max comes from'
    sampling:
      thinking:
        source: vendor-card
        temp: 1.0
        top_p: 0.95
        tuned:
        - instruct
        - chat
        - reason
        - code
        - tools
    modalities:
      input:
      - text
      - image
      - video
      - audio
      output:
      - text
    turns:
      source: ggml-org/MiMo-V2.6-Flash-RL-GGUF
      developer: own
      leading_system_max: unlimited
      mid_system: ok
      mid_developer: ok
    thinking:
      knob: enable_thinking
      kind: boolean
      default: true
