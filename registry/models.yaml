# the source of truth for model facts, keyed by huggingface base repo.
#
# the repo IS the name. an invented short name is a second thing to keep in sync,
# and llama-tools grew four separate short-name tables before this file existed.
#
# WHAT BELONGS HERE: facts a human had to establish and a machine cannot fetch --
# which quant to prefer and why, the sampling numbers a vendor recommends,
# capability tags, the ids each benchmark source invented.
#
# WHAT DOES NOT: anything derivable. parameter counts, gguf byte sizes, native
# context, architecture, mtp presence and which thinking knob a chat template
# accepts are fetched into data/model-facts.json and joined by the same key.
#
# WHAT ALSO DOES NOT: host policy, including the name a consumer serves it
# under. which of these to run, as what, at what context, is the consumer's.
#
# seeded from the pre-split llama-tools llama-swap config; prose notes are
# hand-written.

version: 1
models:
  MiniMaxAI/MiniMax-M2.5:
    kind: text
    name:
      short: minimax-m2.5
    quants:
    - repo: unsloth/MiniMax-M2.5-GGUF
      quant: UD-Q3_K_XL
    sampling:
      thinking:
        temp: 1.0
        top_p: 0.95
        top_k: 40
        min_p: 0.1
        presence_penalty: 0.0
        repeat_penalty: 1.0
        tuned:
        - instruct
        - chat
        - reason
        - code
        - tools
    ids:
      aa: minimax-m2-5
      gbench: minimax/minimax-m2.5
      lmarena: minimax-m2.5
      swerebench: MiniMax M2.5
      epoch: MiniMax-M2.5
    modalities:
      input:
      - text
      output:
      - text
    turns:
      source: unsloth/MiniMax-M2.5-GGUF
      developer: dropped
      leading_system_max: 1
