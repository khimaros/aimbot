  # `--diarize-method` rather than a `--backend` -- it is absent from the
  # 148-entry feature matrix, so lint would have rejected it -- and the
  # wespeaker entry above already carries that recipe. `gemma4-e2b` and
  # `gemma4-e4b` load models this registry holds as text entries, so they gained
