  # TRACKED, NOT SERVED, AND NOT SCORED -- the most-liked TTS model on the hub
  # that this roster has no path to at all. 941 likes and 28.8k downloads
  # against kokoro's 2.4k, and no source here scores it: absent from artificial
  # analysis' text-to-speech board, from tts arena and from voice arena.
  #
  # NO quants block on purpose. supertonic publishes four `.onnx` files and
