  Qwen/Qwen3.8-Flash-Next:
    kind: text
    name:
      short: qwen3.8 flash next
      match: qwen\s*-?3\.8[\s-]*flash[\s-]*next|qwen3\.8-flash-next
    quant_sweep:
      url: https://unsloth.ai/docs/models/qwen3.8-next
      source: unsloth
      repo: unsloth/Qwen3.8-Flash-Next-GGUF
      columns: [quant, gb, top1, kld, delta]
      note: ten rungs of mean kl divergence and top-1 agreement against bf16, published on
        unsloth's docs site rather than on the card. the rows are the page's own search index,
        so the layout above is declared rather than read off a header
    quants:
    - repo: unsloth/Qwen3.8-Flash-Next-GGUF
      quant: UD-IQ4_XS
      note: 'UD-IQ4_XS at {gib} rather than UD-Q4_K_XL, the next rung up, at
        {gib@UD-Q4_K_XL}. what the step up buys is measured -- unsloth publishes top-1 agreement against
        bf16 for all ten rungs, 89.554% here against 92.255% there -- and what it costs is the
        difference between the two, which is memory a host can keep for the companion models it
        runs beside this one instead. the tags overstate how
        far the ladder compresses: 29% of the weights are an n-gram table whose 160-column rows take
        only block-32 types, so the table never goes below ~4.25 bits and UD-IQ1_S is {bpw@UD-IQ1_S} at {gib@UD-IQ1_S}
        rather than anything like one. every rung is sharded 3-4 ways, and the card {card} states
        sizes in decimal gb, so its figures read ~7% larger than the gib this registry sizes in'
    - repo: agentionai/Qwen3.8-Flash-Next-AP-GGUF
      quant: AP-Q4_K_XL
      note: 'a second ladder: seven tiers, one unsharded file each, sized in gib that match the
        bytes measured here, so unlike the unsloth card''s decimal gb they need no conversion. the
        tier names "do not describe the experts" {card}. from AP-IQ2_S up, the experts'' gate and
        up projections are IQ2_S, IQ3_XXS, IQ3_S, half IQ4_XS and half IQ3_S, Q4_K, Q5_K and Q5_K,
        so AP-IQ4_XS at {gib@AP-IQ4_XS} is IQ3_S and AP-Q4_K_M at {gib@AP-Q4_K_M} is only half
        IQ4_XS. every tier keeps the down projections and the 160-column n-gram table at IQ4_NL
        and puts Q6_K on the attention, ssm and embedding tensors; the one exception is
        AP-Q5_K_XL, whose Q5_1 table is all that separates it from AP-Q5_K_M. this tier, the
        card''s default, is Q4_K on gate and up like unsloth''s UD-Q4_K_XL, and the step from {gib}
        to that file''s {gib@unsloth/Qwen3.8-Flash-Next-GGUF:UD-Q4_K_XL} is unsloth''s down
        projections, Q5_1 with five of the 48 layers at Q8_0, its Q8_0 attention, ssm and
        embedding tensors, and Q5_K on one layer of gate and up. AP-IQ4_XS is the recipe of the
        pinned unsloth UD-IQ4_XS, and the step from {gib@AP-IQ4_XS} to
        {gib@unsloth/Qwen3.8-Flash-Next-GGUF:UD-IQ4_XS} is again unsloth''s Q8_0 on attention,
        ssm and embedding tensors and on five layers of down projections, plus IQ4_XS on one layer
        of gate and up. no tier carries an mtp head: every file has the 1224 tensors unsloth''s main
        files do. the quality figures are kl divergence and top-1 agreement against one reference
        on a held-out corpus at -c 2048 -- 85.71% top-1 here, 84.22% at AP-Q4_K_M, 82.89% at
        AP-IQ4_XS -- and none reads against unsloth''s page, which puts its near-identical
        UD-IQ4_XS at 89.554% top-1 and 0.0836 kl divergence against 82.89% and 0.1584 here. the
        card chose held-out text because the n-gram table has memorised wikitext, and measures the
        same file 6.9 to 8.6 points higher top-1 on wikitext than off it, the gap widening as the
        quant shrinks. its vram column is the download less that table, which it moves to system
        ram with `-ot per_layer_token_embd=CPU`. on mainline that flag restates the default -- the
        table is an input tensor and sits on the cpu anyway -- and qwen4exp has marked it
        TENSOR_READ_LAZY since b10660, so with mmap on and `--tensor-read-lazy` at its default
        `auto` a stock build reads its rows from the file as tokens need them instead of keeping
        it resident, for these files and unsloth''s alike. the vision projector is the repo''s own
        mmproj-F16.gguf at the root, and the gguf headers carry unsloth''s chat template byte for
        byte rather than qwen''s'
    - repo: ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF
      quant: IQ3_XXS
      note: 'a third ladder, three rungs, and the only one whose publisher ran benchmarks
        rather than a divergence metric: ist austria assigns a quant type per tensor by
        gradient search under a size budget. the pinned rung is {gib} at {bpw}, well under the
        pinned unsloth one, and their card {card} calls it "the strongest operating point",
        just short of the bf16 task average -- level on aime25, half a point down on
        gpqa-diamond and a point on livecodebench v6. the curve is in
        research/quant-curves.json rather than recited here. every rung is two shards and the
        second is byte-identical across all three: it is the same per_layer_token_embd table
        at IQ4_NL the note above describes, held out of the search because its 160-column rows
        take only block-32 types, and read "one row per token" off disk rather than resident.
        Q2_0 at {gib@Q2_0} is the speed rung -- a mainline ggml type since b9913 that
        "avoids lookup-table formats" altogether, and the card measures it delivering "3.4x
        the prompt throughput" of the IQ2_XS rung beside it at {gib@IQ2_XS}, for a tenth of a
        point of task average. none of these reads against the unsloth sweep above, kl
        divergence and top-1 agreement rather than a benchmark. the mmproj is separate, and
        card sizes are decimal gb'
    runtime:
      arch: qwen4exp
      mainline: true
      since: b10660
      merged: '2026-08-27'
    ids:
      aa: qwen3-8-flash-next
      gbench: ''
      lmarena: qwen3.8-flash-next
      swerebench: ''
      epoch: ''
    sampling:
      thinking:
        source: quant-card
        temp: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repeat_penalty: 1.0
        tuned:
        - instruct
        - chat
        - reason
        - code
        - tools
        thinking: xhigh
      instruct:
        source: quant-card
        temp: 0.7
        top_p: 0.8
        top_k: 20
        min_p: 0.0
        presence_penalty: 1.5
        repeat_penalty: 1.0
        tuned:
        - instruct
        - chat
        - code
        - tools
        thinking: 'off'
    notes: 'the vendor''s 125b and the hub''s 180b are one model counted two ways, and the
      card {card} spells out which: "125B with 6B activated, plus 51B n-gram embedding and
      4B MTP". the mtp layer does not survive conversion into the main files -- llama.cpp''s
      converter drops it, and their headers carry no nextn tensor and no nextn key. two heads have
      been exported on their own since. dzannotti/Qwen3.8-Flash-Next-MTP-GGUF is a Q4_K_M `-md`
      file that can also be spliced into unsloth''s UD-Q4_K_XL as a fifth shard; it needs the
      draft-head graph its repo ships as a patch, taken from a llama.cpp PR that was closed
      unmerged, and its readme measures 20.3 to 35.8 t/s on code on a strix halo under ROCm.
      unsloth followed -- "MTP is now available for 1.3-1.7x Faster inference in Unsloth"
      {card@unsloth/Qwen3.8-Flash-Next-GGUF} -- with six files under `MTP/` in its own repo, whose
      `shared-` heads borrow the token embedding and output projection from the loaded model;
      they need PR 28243, built on PR 27836, both open, and their readme measures a net loss at
      eight concurrent streams. mainline has no mtp graph for qwen4exp, so no drafter is
      declared on this entry: the page would promise a speedup a stock build cannot deliver,
      and would charge every head file in `MTP/` as though one were loaded. vision arrived after
      the release rather than with it: unsloth published mmproj-F16 on 2026-08-27 and the repo
      was text-only for its first three days. qwen4exp support landed in llama.cpp on the same
      day, so a build older than that loads none of these files.'
    modalities:
      input:
      - text
      - image
      - video
      output:
      - text
    turns:
      source: unsloth/Qwen3.8-Flash-Next-GGUF
      developer: as-system
      leading_system_max: unlimited
      mid_system: rejected
      mid_developer: rejected
      upstream_differs: [developer, leading_system_max]
    thinking:
      knob: reasoning_effort
      gate: enable_thinking
      gate_default: true
      accepts: [low, medium, xhigh]
      default: xhigh
      aliases: {high: xhigh}
  # agentionai's own fine-tunes of the two qwen3.8 entries above, and the reason
  # `publishers.txt` already called them "AP-* ladders of qwen3.8, plus its own
  # Signal fine-tunes" before either was carried. both are self-distillation on
  # the base model's OWN answers under an instruction to be direct, so they add
  # no external data and claim no new knowledge -- what they change is how many
  # tokens the answer costs, which is a property no benchmark on this roster
  # measures and the reason both entries lean on the publisher's own numbers.
  agentionai/Signal-3.8-27B:
    kind: text
    name:
      short: signal 3.8 27b
      match: signal[\s.-]*3\.8[\s-]*27b|signal[\s-]*27b
    notes: >-
      a minimally invasive fine-tune of qwen3.8-27b for token efficiency {card}:
      57% fewer answer tokens and 52% fewer thinking tokens on the publisher's
      held-out prompt set, at matched or better quality -- 98.3% against 98.3% on
      gsm8k with thinking off and 95.0% against 92.5% with it on. the mechanism
      is stated plainly and is checkable: preambles go from 13% of answers to 0%,
      markdown headers from 47% to 18%.

      THE NUMBERS ARE THE PUBLISHER'S AND THEY SAY SO. the card notes the
      percentages were measured on the FIRST release and that the 2026-09-13
      weights "trade a little of that reduction for stability", with the
      re-measurement still in progress. so the direction is well evidenced and
      the magnitude is provisional by the publisher's own account.

      the second claim is the more interesting one for a host: qwen3.8-27b ships
      an MTP draft head, and a terser model is a more predictable one, so draft
      acceptance rises from 72% to 94% on structured output at draft 3. that is a
      speedup on top of the shorter answers and it compounds -- which is also why
      the sampling block matters here more than usual. the card is unusually
      direct about it: without min-p "long answers can run away into repetition
      on some draws", on signal and on the base model alike.
    quants:
    - repo: agentionai/Signal-3.8-27B-GGUF
      quant: AP-Q4_K_XL
    runtime:
      arch: qwen35
      mainline: true
      since: b7990
      merged: '2026-02-10'
    ids:
      aa: ''
      gbench: ''
      lmarena: ''
      swerebench: ''
      epoch: ''
    modalities:
      input:
      - text
      - image
      - video
      output:
      - text
    sampling:
      thinking:
        source: generation-config
        temp: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.05
        tuned: [instruct, chat, reason]
    turns:
      source: agentionai/Signal-3.8-27B-GGUF
      developer: rejected
      leading_system_max: 1
      mid_system: rejected
      mid_developer: rejected
    thinking:
      knob: reasoning_effort
      gate: enable_thinking
      gate_default: true
      accepts: [low, medium, xhigh]
      default: xhigh
  # KEYED ON THE CONVERSION, because the base repo is not publicly readable:
  # `agentionai/Signal-3.8-Flash-Next` answers 401 to the card, the config and
  # the hub metadata alike, so keying on it gave an entry with no facts at all.
  # that is what `gguf_only` is for. expect the facts to degrade with it: the
  # parameter count comes off the repo NAME and the attention geometry off the
  # gguf header rather than off a config.json.
  agentionai/Signal-3.8-Flash-Next-GGUF:
    kind: text
    gguf_only: true
    name:
      short: signal 3.8 flash next
      match: signal[\s.-]*3\.8[\s-]*flash[\s-]*next|signal[\s-]*flash[\s-]*next
    notes: >-
      the same self-distillation over qwen3.8-flash-next {card}, and the better
      evidenced of the two: 26% fewer reasoning tokens on math-500 with half the
      hesitation markers AND a higher score, 99.2% against 97.5%. the 177b
      mixture-of-experts backbone, the vision encoder and the MTP head are
      untouched, which is what makes it a drop-in.

      the agentic number is the one worth reading carefully. as the coding agent
      behind their own harness on ten terminal-bench 2.0 tasks it solved 10 of 10
      against the base model's 8, in 25% less wall time and 15% fewer tokens on
      the tasks both solved -- and the card says outright that it is one trial
      per task, so the pass counts are "indicative rather than a rigorous rate".
      ten tasks at n=1 is a direction, not a rate, and the roster's own
      terminal-bench column is a different measurement on a different harness.

      MTP acceptance goes 69% to 90% on coding output, the same compounding
      effect the 27b entry describes.
    quants:
    - repo: agentionai/Signal-3.8-Flash-Next-GGUF
      quant: AP-Q4_K_XL
    - repo: agentionai/Signal-3.8-Flash-Next-GGUF
      quant: AP-IQ4_XS
      note: 'the cheaper of the two rungs pinned here, {gib} against the
        {gib@AP-Q4_K_XL} above it: IQ3_S on the experts'' gate and up where that
        one puts Q4_K, and otherwise the recipe unsloth ships as UD-IQ4_XS over
        the base weights -- {gib@unsloth/Qwen3.8-Flash-Next-GGUF:UD-IQ4_XS} is
        the same file with Q8_0 rather than Q6_K on the attention, ssm and
        embedding tensors, five layers of down projections, and IQ4_XS on one
        layer of gate and up. what every tier of this ladder is actually made of
        is on the base entry, and the tier names describe none of them'
    runtime:
      arch: qwen4exp
      mainline: true
      since: b10660
      merged: '2026-08-27'
    ids:
      aa: ''
      gbench: ''
      lmarena: ''
      swerebench: ''
      epoch: ''
    modalities:
      input:
      - text
      - image
      output:
      - text
    sampling:
      thinking:
        source: tuned-here
        note: >-
          taken from the SIBLING entry's card rather than this one's. signal 3.8
          27b states the settings outright -- temperature 0.6, min-p 0.05, top-p
          0.95, top-k 20 -- and says they apply "on Signal and on the base model
          alike" {card@agentionai/Signal-3.8-27B}, which is the same fine-tune
          over the same publisher's recipe.
          this repo ships no generation_config to read because the weights repo
