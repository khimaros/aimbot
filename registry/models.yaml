        - reason
        - code
        - tools
    notes: 'the only model here whose thinking knob is `reasoning_strength` rather than
      enable_thinking or reasoning_effort -- a local-first model by design, which
      the card {card} states outright: "Muse Glimmer was optimized for local
      deployment, and designed to run at practical speeds on consumer hardware
      without sacrificing quality." llama.cpp #26941 translates reasoning_effort to it, so a client
      that speaks the common knob works against a recent build and silently does nothing against
