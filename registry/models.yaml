  black-forest-labs/FLUX.2-dev:
    kind: image
    name:
      short: flux-2-dev
    notes: >-
      CARRIED FOR THE SCORE. 1197 on artificial analysis and 1146 on lmarena,
      which is above every other image model on this roster, and two things
      stand between that number and running it here.

      the licence is `flux-non-commercial-license`. it is downloadable and it is
      not free, and this registry only reads it as open weights at all because
      that filter asks `can you fetch these` rather than `is this OSI open` --
      the same widening that let krea 2 and ideogram 4 be matched. a consumer
      pointing a business at it should read the licence rather than the flag.

      the stack is the other reason: sd.cpp wants a 24b mistral as the TEXT
      ENCODER, so the three files are a 18gib diffusion model, a 320mib vae and
      a 24b llm. the klein entries buy most of the family's quality for a
      quarter of that, which is why they are the ones with a serving story.
