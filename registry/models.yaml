        reduced end-to-end generation speed" {card@smalinin/DeepSeek-V4.1-Flash-GGUF} on the
        system it was tried on, which is why the
        card leaves it out of its own recommended command while documenting `--spec-draft-n-max
        5` for anyone who wants to re-run the question'
    sampling:
      thinking:
        source: vendor-card
        temp: 1.0
        top_p: 0.95
        top_k: 40
        min_p: 0.1
        presence_penalty: 0.0
        repeat_penalty: 1.0
