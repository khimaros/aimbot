      # optional in the alias even though only this one is on the roster
      match: fara[\s-]*(?:1\.5[\s-]*)?27b
    notes: >-
      a computer-use agent, not an assistant: it reads a browser through
      screenshots -- no dom, no accessibility tree -- and emits click, type,
      scroll and search as tool calls. supervised fine-tune of qwen3.5-27b, so
      it is the same shape and cache geometry as the base already carried here,
      and the card asks that it be run only under microsoft's own fara cli or
      magentic-ui rather than a general chat harness. the three benchmarks it
      reports are web-agent suites no source in this corpus carries, so it is
      sized and unranked rather than scored badly.
    quants:
    - repo: bartowski/Fara1.5-27B-GGUF
