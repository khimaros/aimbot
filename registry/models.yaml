  # against a capture. the two it could not settle are marked on the entries.
  #
  # every gguf repo here is the one crispasr's own README names, for the reason
  # the ASR roster above gives: two conversions of one checkpoint are not
  # interchangeable, and the qwen3-tts pair is this roster's proof of it.
  #
  # NONE of these is scored. artificial analysis' TTS board rates chatterbox and
