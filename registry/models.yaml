    sampling:
      tool-use:
        source: tuned-here
        note: the card publishes no sampler table, only an inference snippet
          that runs greedy, so this is read off example code. greedy is the
          right default for the job regardless -- a misread pixel coordinate
          is a click in the wrong place, and no amount of sampling recovers it
        temp: 0.0
        top_p: 1.0
        top_k: 0
        min_p: 0.0
        presence_penalty: 0.0
        repeat_penalty: 1.0
        tuned:
        - instruct
        - tools
    ids:
      aa: ''
      gbench: ''
      lmarena: ''
      swerebench: ''
      epoch: ''
    modalities:
      input:
      - text
      - image
      - video
      output:
      - text
    turns:
      source: bartowski/Fara1.5-27B-GGUF
      developer: rejected
      leading_system_max: 1
      mid_system: rejected
      mid_developer: rejected
    thinking:
      knob: enable_thinking
