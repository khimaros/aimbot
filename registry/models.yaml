  # image families stable-diffusion.cpp detects that the roster did not carry.
  # `fetch-sdcpp-support --report` reports 15 of them; these are the ones with a
  # gguf somebody has published and an ungated base to key on. the rest are
  # mostly VIDEO -- wan, LTX, hunyuan, SVD, lingbot -- and this registry has no
  # kind for a model that emits frames.
  #
  # the VERSION each resolves to is NOT asserted here. sd.cpp identifies a model
  # by tensor names rather than by an architecture string, so the collector reads
  # the gguf header and says which signature matched; a claim written by hand
  # would be a guess about somebody else's detector.
  black-forest-labs/FLUX.1-dev:
    kind: image
    name:
      short: flux-1-dev
      match: flux[\s.-]*1[\s.-]*dev
    notes: >-
      the model that made local diffusion worth doing, and the generation before
      the FLUX.2 entries this roster already carries. leejet publishes the gguf,
      which matters here: he wrote stable-diffusion.cpp, so his conversions are
      the ones its loader is tested against.

      three files, like every flux: the diffusion model below, the t5-xxl text
      encoder as a component, and `ae.safetensors` out of this repo. the base is
      `gated: auto` -- a click-through rather than an approval queue -- which is
      the same shape as the FLUX.2 entries and the same reason this roster reads
      it as open weights at all.
    engine:
    - stable-diffusion.cpp
    quants:
    - repo: leejet/FLUX.1-dev-gguf
      quant: Q4_K
      role: diffusion
    ids:
      aa-t2i: FLUX.1 [dev]
      lmarena-t2i: ''
      lmarena-edit: ''
    modalities:
      input:
      - text
      output:
      - image
    components:
    - repo: city96/t5-v1_1-xxl-encoder-gguf
      quant: t5-v1_1-xxl-encoder-Q8_0.gguf
      role: text-encoder
    - repo: black-forest-labs/FLUX.1-dev
      quant: ae.safetensors
      role: vae
