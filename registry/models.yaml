    notes: the 8b rung of the ternary line, from qwen3-8b rather than the qwen3.6-27b its 27b
      siblings derive from. unlike them it DOES publish base weights, which is why this is
      keyed on the unpacked repo where they are keyed on their gguf. ternary weights, so the
      bits-per-weight retention curve does not model it and any quant-adjusted score for it is
      an extrapolation rather than a fit. the template in its gguf header, which is the one
      llama.cpp loads, closes the reasoning block unconditionally where the 27b gates it on
      enable_thinking -- this rung ships with no way to turn thinking on, which is why it
      carries no thinking knob here.
