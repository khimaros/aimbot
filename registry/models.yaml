  OpenMOSS-Team/MOSS-Transcribe-Diarize:
    kind: speech
    name:
      short: moss-transcribe-diarize
      match: moss[\s-]*transcribe[\s-]*diarize
    notes: >-
      the only model here that diarizes BY ITSELF: the card {card} describes "an
      end-to-end audio understanding model for long-form multi-speaker
      transcription, diarization, timestamps, and acoustic event awareness", a
      whisper encoder feeding qwen3 0.6b that emits all of it in one decode, rather than transcribing and then clustering embeddings after
      the fact. that makes it the one entry whose speaker labels do not depend
      on the --diarize post-step, and the one to compare foxnose against.

      SO DO NOT SEND `diarize=true` TO IT. the labels are already on the
      segments -- the backend parses the model's own `[t][Sxx]text[t]` output
      and writes them during decoding -- and `response_format=diarized_json`
      returns them without the flag, because that format serialises whatever is
      on the segments rather than being gated on the flag. asking for
      diarization instead runs the generic post-step, which assigns
      `seg.speaker` unconditionally with no guard for a segment that already has
      one, so the joint model's attribution is computed and then overwritten.
      the skip that exists in the server is tiron-specific: it looks for
      `<|speakerN|>` markers left in the transcript text, and this model's
      markers are `[Sxx]`, consumed by its own parser before the linker sees
      them.

      measured on a file with two known speakers, by a session running its own
      crispasr server: `diarize=true` gave 8 speakers, no flag gave 3 -- 270
      segments on one, 45 on a second, 10 on a third, which reads as two
      speakers and a 3% tail. the 8 was the post-step, not this model.

      that rule is SPECIFIC TO A MODEL THAT LABELS DURING DECODING and does not
      generalise: see the diarization note on the pyannote entry.

      no third-party suite scores it, so there is no number here saying whether
      joint beats post-hoc. that is the measurement this roster is missing.
    quants:
    - repo: cstr/MOSS-Transcribe-Diarize-GGUF
      quant: Q8_0
      role: model
    - repo: cstr/MOSS-Transcribe-Diarize-GGUF
      quant: Q4_K
      role: model
    ids:
      aa-stt: ''
      aa-stt-streaming: ''
      aa-tts: ''
      tts-arena: ''
      voicearena: ''
      open-asr: OpenMOSS-Team/MOSS-Transcribe-Diarize
    crispasr:
      backend: moss-diarize
      # the one model here that labels while decoding. a consumer reads this to
      # decide whether to ASK for diarization: true means the labels are already
      # there and asking overwrites them, false or absent means asking is the
      # only way to get any
      labels_speakers: true
    modalities:
      input:
      - text
      - audio
      output:
      - text
    turns:
      source: OpenMOSS-Team/MOSS-Transcribe-Diarize
      developer: dropped
      leading_system_max: unlimited
      mid_system: ok
      mid_developer: dropped
    thinking:
      knob: enable_thinking
      kind: boolean
      default: true
  # the diarization weights. these transcribe nothing: they are what --diarize
  # loads BESIDE an ASR model, so they carry `crispasr.diarize` instead of a
  # backend and are `kind: diarize` rather than speech. a consumer selects an
  # ASR model and points the diarizer flags at these.
  #
  # no `modalities` on any of them. the vocabulary is text/image/video/audio/
  # embeddings and none of it describes a speaker timeline; an embedder could
  # claim `embeddings`, but that word already means a text-embedding server to
  # every consumer that reads this field, and one of these is a segmenter that
  # emits no vector at all.
  Wespeaker/wespeaker-voxceleb-resnet34-LM:
    kind: diarize
    name:
      short: wespeaker-resnet34-lm
      match: we[\s-]*speaker
    notes: >-
      the foxnose recipe's embedder, which the card {card} gives as "ResNet34
      based r-vector (After large margin finetune)" trained on "VoxCeleb2 Dev
      dataset, containing 5994 speakers": 256-d speaker embeddings over sliding
      windows, counted by GMM/BIC and clustered spectrally, which ESTIMATES the
      number of speakers instead of being told it.

      CARRIED BUT NOT SERVED, and the DER to quote is the publisher's LATER one.
      crispasr's README says 7.3% on voxconverse dev against pyannote plus
      titanet's 7.8; the gguf card at cstr/wespeaker-resnet34-lm-GGUF retracts
      it -- "numbers near 3-7% DER quoted elsewhere in this project's history
      came from an 8-file subset that turned out to be unrepresentative:
      identical code scores 7.3% there and 33.1% on" the full set. the measured
      run is 40 files of voxconverse dev at a 0.25s collar with
      `--diarize-max-speakers 8`: 33.1% DER, the speaker count exactly right on
      18 of 40, within one on 34. against the upstream python pipeline's OWN
      output with the count pinned it scores 3.93% with zero speaker confusion,
      which measures agreement with the reference rather than accuracy against
      humans.

      that is the same failure this roster hit. over crispasr's HTTP server,
      `--diarize-method foxnose` split a synthesized four-turn two-voice
      dialogue into 8 segments and gave every one its own speaker,
      byte-identically whatever `diarize_max_speakers` or `diarize_embedder` the
      request carried. the card {card} names the cause -- "estimating the number of
      speakers is the weak link, not the embeddings" -- and says the picture
      improves sharply with `--diarize-num-speakers N`, which a transcription
      client does not know. pyannote plus titanet returns A B A B on the same
      file without being told.
    quants:
    - repo: cstr/wespeaker-resnet34-lm-GGUF
      quant: F16
      file: wespeaker-resnet34-lm.gguf
      role: diarize-embedder
      note: 'conv kernels F32 and linear F16, which the card marks recommended: an all-F16
        file would be smaller, but "ggml''s CPU conv path is 2.2x slower" {card} on it. the
        licence is the trap here -- "Several downstream projects describe them as Apache-2.0;
        that is incorrect" -- the weights are CC-BY-4.0, and redistributing them keeps the
        attribution'
    - repo: cstr/wespeaker-resnet34-lm-GGUF
      quant: F32
      file: wespeaker-resnet34-lm-f32.gguf
      role: diarize-embedder
      note: the reference precision, per the card {card}, for checking parity against upstream
        rather than for serving -- the file it recommends is the mixed one beside it, which
        already keeps the conv kernels at this precision
    crispasr:
      diarize: embedder
  pyannote/segmentation-3.0:
    kind: diarize
    name:
      short: pyannote-seg-3.0
      match: pyannote
    notes: >-
      the diarizer actually in use {card}. `--diarize-method pyannote` runs this
      once over the whole audio for a global speaker-turn timeline, then splits ASR
      segments at its boundaries. it decides WHEN the speaker changes and
      nothing about who, so it is paired with titanet for identities that hold
      across a long file.

      chosen over foxnose by measurement here, and the publisher's own numbers
      later agreed: the 7.3-versus-7.8 DER that favoured foxnose came off an
      8-file subset its card now calls unrepresentative. see the wespeaker
      entry.

      WHETHER TO ASK FOR IT DEPENDS ON THE ASR MODEL, and the two cases want
      opposite requests. a model that labels speakers DURING DECODING already
      has them on its segments, and `diarize=true` overwrites its work with this
      pass -- moss-transcribe-diarize is the one such entry here and its note has
      the numbers. every other ASR model on this roster labels nothing by
      itself, and for those this post-step is the only route to a speaker at
      all: measured elsewhere, whisper and parakeet asked for
      `diarized_json` WITHOUT the flag return everything under a single label
      rather than returning no labels, which reads like a working diarizer that
      found one speaker. so `never send diarize` is not a general rule; it is
      the rule for the joint model and the exact wrong rule for the rest.

      `diarize_max_speakers` is not a ceiling. two observations, and they
      disagree about how badly: here, `--diarize-method foxnose` produced
      byte-identical output whatever the value was, which is a parameter not
      reaching a clusterer; elsewhere, on whatever method that server defaulted
      to, it REDUCED the count (whisper 5 to 3) without ever reaching the
      requested 2. neither is the parameter doing what its name says, and the
      method is not selectable per request, so a client cannot even tell which
      behaviour it is getting.

      the base repo is gated on huggingface and the gguf conversion is not,
      which is why the quant repo is not the model's own.
    quants:
    - repo: cstr/pyannote-v3-segmentation-GGUF
      quant: F32
      file: pyannote-seg-3.0.gguf
      role: diarize-segment
    crispasr:
      diarize: segmentation
  nvidia/speakerverification_en_titanet_large:
    kind: diarize
    name:
      short: titanet-large
      match: titanet
    notes: >-
      192-d speaker embeddings -- the card {card} calls it "the backbone for
      speaker verification and diarization tasks" -- and what
      `--diarize-embedder auto` resolves to on the pyannote path -- pinned rather than left to `auto`, which fetches
      at request time. carried because pyannote's per-pass track ids are local
      to a pass and drift over a long recording; clustering on these makes them
      stable for one file, and on the four-turn test it also tightened the
      labels from `C B C B` to `A B A B` and stopped the turns fragmenting.

      session-scoped by construction -- the embeddings are computed per
      recording and discarded, and the labels stay anonymous. the persistent
      named-profile feature is a different thing entirely and is not carried
      here.
    quants:
    - repo: cstr/titanet-large-GGUF
      quant: F16
      file: titanet-large.gguf
      role: diarize-embedder
    crispasr:
      diarize: embedder
  # SERVED, and it was the entry written to watch for this. the highest-scoring
  # open-weights TTS artificial analysis has -- 1214.89 elo, above
  # fish-s2-pro's 1127.78 -- and until crispasr shipped `bt2-tts` nothing here
  # loaded it. the port it was tracking (issue #412) landed.
  #
  # two conversions of one checkpoint and only one is servable, which is the
  # qwen3-tts situation again. cstr's is the one crispasr's registry names and
  # is what carries the `crispasr:` block; `HoppouAI/Breeze-TTS-2.cpp` says on
  # its own card that its files "will not load in llama.cpp. They need the
  # Breeze-TTS-2.cpp runtime", a separate C++ reimplementation at
  # github.com/HoppouAI/Breeze-TTS-2.cpp. it stays as a plain quant so the sweep
  # sizes it and a reader can see the other path.
  #
  # the codec is NOT in cstr's files. breeze bundles an audio tokenizer that is
  # bit-identical to `Qwen/Qwen3-TTS-Tokenizer-12Hz`, so crispasr downloads
  # `cstr/qwen3-tts-tokenizer-12hz-GGUF` alongside the model. that is a
  # `components:` entry for the reason orpheus' snac is one -- there is one, it
  # is not a rung, and picking it is not a decision. it is pinned at f16 on the
  # codec repo's own advice: quantising the codec drifts earlier than
  # quantising the talker, so if precision has to go somewhere it goes here.
  #
  # two talker rungs rather than the one every other cstr conversion here pins,
  # because this repo publishes a ladder and the card says which end of it is
  # which: q4_k is what crispasr's own registry defaults to and q8_0 is the
  # step above. both are crispasr conversions and both load, so both carry the
  # backend. the f16 is reference precision for a diff harness rather than a
  # rung somebody serves, and is not pinned.
  #
  # the port notes are still worth reading before trusting any OTHER
  # conversion. it is a CSM (sesame) fork with a qwen3 backbone and the
  # qwen3-tts codec, and the feasibility doc flags that `config.json`'s
  # `"use_bidirectional_attention": false` is a DECOY -- the text encoder is
  # bidirectional. a converter that believes the config produces a model that
  # loads and sounds wrong, which is the failure mode this roster has already
  # been bitten by once with qwen3-tts's two namespaces.
  BreezeBlue/Breeze-TTS-2:
    kind: speech
    name:
      short: breeze-tts-2
      match: breeze[\s-]*tts
    engine:
    - Breeze-TTS-2.cpp
    quants:
    - repo: cstr/breeze-tts-2-GGUF
      quant: Q4_K
      role: model
      crispasr:
        backend: bt2-tts
    - repo: cstr/breeze-tts-2-GGUF
      quant: Q8_0
      role: model
      crispasr:
        backend: bt2-tts
    - repo: HoppouAI/Breeze-TTS-2.cpp
      quant: Q8_0
    components:
    - repo: cstr/qwen3-tts-tokenizer-12hz-GGUF
      file: qwen3-tts-tokenizer-12hz.gguf
      role: codec
    ids:
      aa-stt: ''
      aa-stt-streaming: ''
      aa-tts: breeze-tts-2
      tts-arena: ''
      voicearena: ''
    modalities:
      input:
      - text
      output:
      - audio
  # TRACKED, NOT SERVED, AND NOT SCORED -- the most-liked TTS model on the hub
  # that this roster has no path to at all. 941 likes and 28.8k downloads
  # against kokoro's 2.4k, and no source here scores it: absent from artificial
  # analysis' text-to-speech board, from tts arena and from voice arena.
  #
  # NO quants block on purpose. supertonic publishes four `.onnx` files and
  # nothing else, and neither the official repo, `onnx-community`, nor any of
  # the twenty community forks (coreml, mnn, tensorrt, mlx) carries a gguf.
  # crispasr names no backend for it either. an onnx file is not a quant and
  # writing one into `quants:` would claim a rung a consumer could select.
  #
  # it is here because the roster should be able to say what it is MISSING, and
  # because it took a human reading a hub page to find it: the discovery sweep
  # asked only for text-generation repos carrying a gguf, so the whole speech
  # half was invisible to it. that is fixed -- fetch-hf-catalog sweeps the two
  # speech pipelines and records `gguf` per row rather than filtering on it --
  # and this entry is the case that fix exists for.
  #
  # what is known about it is speed. a level1techs/reddit thread in the corpus
  # times Supertonic2 at 358ms to first audio and 19.65x realtime against
  # kokoro onnx's 713ms and 4.80x, on the same box. that is a forum measurement
  # rather than a benchmark, and it is the only number this repo has.
  Supertone/supertonic-3:
    kind: speech
    name:
      short: supertonic-3
      match: supertonic
    modalities:
      input:
      - text
      output:
      - audio
    ids:
      aa-stt: ''
      aa-stt-streaming: ''
      aa-tts: ''
      tts-arena: ''
      voicearena: ''
  # the crispasr synthesis roster. crispasr compiles in 28 TTS backends and this
  # registry named three of them, which was an accident of plumbing rather than a
  # decision: `fetch-crispasr --report` computed the other 25 from the day the
  # collector landed and no punch list printed it, so nobody was ever asked.
  # `research/decided.txt` -- the file that records having looked -- holds three
  # rows and all three are text models.
  #
  # every entry below is keyed on the weights, and `scripts/resolve-base` is what
  # found them: crispasr's README names the conversion, the hub's `base_model`
  # names what it converts, and 62 of the 66 uncarried backends resolve that way
  # against a capture. the two it could not settle are marked on the entries.
  #
  # every gguf repo here is the one crispasr's own README names, for the reason
  # the ASR roster above gives: two conversions of one checkpoint are not
  # interchangeable, and the qwen3-tts pair is this roster's proof of it.
  #
  # NONE of these is scored. artificial analysis' TTS board rates chatterbox and
  # nothing else here; tts arena and voice arena rate hosted SKUs. that is the
  # same gap ROADMAP item 8 describes for the ASR half, and carrying them
  # unscored is deliberate -- the roster should be able to say what runs.
  suno/bark-small:
    kind: speech
    name:
      short: bark
      match: \bbark[\s-]*small\b|suno[\s-]*bark
    notes: >-
      suno's small bark, the model that made prompt-driven TTS popular. the card
      {card} claims more than speech -- it "can generate highly realistic,
      multilingual speech as well as other audio - including music," -- and it
      takes bracketed direction like [laughs] and [sighs] inline rather than a
      style
      parameter, and it sings. the hub names no `base_model` on cstr's
      conversion and crispasr's README repeats the conversion in both columns,
      so this key is the one fact here a capture did not settle -- it is suno's
      own repo, matched by name and confirmed as a text-to-speech repo carrying
      a config.json. the card limits it: "This model is meant for research
      purposes only." {card}
    quants:
    - repo: cstr/bark-small-GGUF
      quant: Q8_0
      role: model
      crispasr:
        backend: bark
    ids:
      aa-stt: ''
      aa-stt-streaming: ''
      aa-tts: ''
      tts-arena: ''
      voicearena: ''
    modalities:
      input:
      - text
      output:
      - audio
  ResembleAI/chatterbox:
    kind: speech
    name:
      short: chatterbox
      match: chatterbox
    notes: >-
      artificial analysis rates it on the TTS board, beside several other
      synthesis models on this roster. 23 languages with separate arabic, german
      and finnish fine-tunes, and it clones from a reference clip. two things the
      card says that the page cannot: every output is marked -- "Every audio file
      generated by Chatterbox includes" {card} resemble's perth watermarker -- and a
      reference clip in another language than the tag carries its accent across,
      "language transfer outputs may inherit the accent of the reference clip's
      language".
    quants:
    # `t3` is the model and `s3gen` turns its tokens into audio. the repo also
    # carries a v3 pair of both, so `quant: Q8_0` alone names four different
    # files here -- which is how the roster came to read this entry's
    # architecture off the vocoder
    - repo: cstr/chatterbox-GGUF
      quant: Q8_0
      file: chatterbox-t3-q8_0.gguf
      role: model
      crispasr:
        backend: chatterbox
    components:
    - repo: cstr/chatterbox-GGUF
      quant: Q8_0
      file: chatterbox-s3gen-q8_0.gguf
      role: vocoder
    ids:
      aa-stt: ''
      aa-stt-streaming: ''
