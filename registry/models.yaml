  # the crispasr roster. crispasr is a whisper.cpp fork carrying ggml runtimes
  # for ~60 ASR architectures behind one CLI and one HTTP server, which is what
  # makes a speech roster worth having: every entry below runs on the same
  # binary, so `crispasr.backend` is the whole difference between them.
  #
  # every gguf repo here is the one crispasr's own README names, because the
  # backend name is only a fact about a file somebody converted for it -- two
  # conversions of one checkpoint are not interchangeable, and asserting a
  # backend for a conversion nobody tested against it would be a guess.
  #
  # every entry declares `text` alongside `audio` on the way in, including the
  # transducer and CTC models that attend to no prompt at all. `modalities`
  # describes the INTERFACE a consumer may send to, not what the decoder does
  # with it: all of these are served over one transcription endpoint that takes
  # a `prompt` field, and crispasr warns and ignores it on a backend that has no
  # use for it. whether a given decoder conditions on that text is a per-model
  # fact, and it is in the notes rather than in this vocabulary.
  nvidia/parakeet-tdt-0.6b-v3:
    kind: speech
    name:
      short: parakeet-tdt-0.6b-v3
      match: parakeet[\s-]*(?:tdt[\s-]*)?0\.6b[\s-]*v3
    notes: >-
      the fast one {card}: a FastConformer encoder with a token-and-duration
      transducer head and no language model to decode through, so it transcribes at roughly
      an order of magnitude the realtime factor of a whisper-class model and
      detects its language across 25 european ones without a separate LID pass.
      no text conditioning at all, which is why it takes no prompt.
    quants:
    - repo: cstr/parakeet-tdt-0.6b-v3-GGUF
      quant: Q8_0
      role: model
    - repo: cstr/parakeet-tdt-0.6b-v3-GGUF
      quant: Q4_K
      role: model
    ids:
      aa-stt: ''
      aa-stt-streaming: ''
      aa-tts: ''
      tts-arena: ''
      voicearena: ''
      open-asr: nvidia/parakeet-tdt-0.6b-v3
    crispasr:
      backend: parakeet
