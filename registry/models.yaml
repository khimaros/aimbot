    # only defaults reasoning_strength to 'high' and validates nothing.
    thinking:
      knob: reasoning_strength
      accepts: [low, medium, high, xhigh]
      default: high
    name:
      short: muse glimmer
      match: muse[\s-]*glimmer|\bglimmer\b
