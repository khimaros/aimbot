      mainline: true
      since: b10353
      merged: '2026-08-10'
    speculative:
      type: draft-dflash
      n_max: 15
      note: dflash denoises a 16-token block in place and yields at most block_size-1
        {card}, so llama.cpp's default of 3 leaves most of it unused
    sampling:
      thinking:
        source: generation-config
        temp: 1.0
        top_p: 0.95
        top_k: 64
