  # the crispasr synthesis roster. crispasr compiles in 28 TTS backends and this
  # registry named three of them, which was an accident of plumbing rather than a
  # decision: `fetch-crispasr --report` computed the other 25 from the day the
  # collector landed and no punch list printed it, so nobody was ever asked.
  # `research/decided.txt` -- the file that records having looked -- holds three
  # rows and all three are text models.
  #
  # every entry below is keyed on the weights, and `scripts/resolve-base` is what
  # found them: crispasr's README names the conversion, the hub's `base_model`
