  # the decision roster. a model that reads a state and one or more typed
  # questions with lettered options and answers with a PROBABILITY PER OPTION,
  # from one forward pass, generating nothing: no decode, no parse, no output
  # outside the options the caller supplied.
  #
  # `kind: text` is the wrong word, and not marginally. it is not served as a
  # chat or completion endpoint, it emits no tokens, and there is no sampling
  # profile to name -- a model with no sampling to sample. the crispasr pipeline
  # kinds are wrong in the other direction, because this IS served, on its own
  # endpoint, and a consumer sends it state rather than a transcript.
  #
  # so it gets a kind, a chip of its own and `decides` in the capability
  # vocabulary, which is what lets JevBench -- the one board that rates this
  # class, and the only one here with a CALIBRATION axis -- score it without
  # putting a decision model in the roster MODELS.md ranks.
  Mapika/decider-4b:
    kind: decision
    name:
      short: decider-4b
      match: decider[\s-]*4b\b
    notes: >-
      the readout is the option-letter logits at each `Answer (` slot, softmaxed
      over the valid letters: one pass answers every question, and the card
      {card} is explicit that letters are never generated. 2 to 255 options a
      question, a state of up to 32k tokens, `abstain_below` for a threshold.
      stage 1 is one supervised pass over 742m tokens of decision mixtures on the
      qwen3.5 4b pretrain; stage 2 is a merged rank-64 LoRA. no RL stage, and the
      card says so.
      the temperature in `decider_config.json` -- 1.099 overall, 1.110 choice /
      1.560 yes-no / 1.287 score per answer type -- DIVIDES those logits for
      calibration. it is not a sampling temperature, which is why this entry has
      no `sampling:` block and why `thinking:` describes a chat template the
      readout never goes through. the card publishes its own regressions rather
      than only its wins: hard multi-step items are overconfident (ECE 0.147
      against v2's 0.046), one form-filling case is answered wrongly, and JevBench
      is where both show up.
    quants:
    - repo: mradermacher/decider-4b-GGUF
      quant: Q8_0
      # the size table keys this pack by FILENAME, because its rungs read
      # `decider-4b.Q8_0.gguf` and a dot is not a separator the tag reader knows
      file: decider-4b.Q8_0.gguf
      role: model
      note: the only conversion of it, and a static one -- {card@mradermacher/decider-4b-GGUF}
        publishes no imatrix rung and says the weighted quants may not come. the
        pin is q8 {gib} rather than the q4 its own table marks "fast, recommended",
        because the answer here is a distribution over the option letters rather
        than a sampled continuation, and no sweep here has measured what a lower
        rung costs a probability
    runtime:
      arch: qwen35
      mainline: true
      since: b7990
      merged: '2026-02-10'
    ids:
      jev: decider-4b-v2
    modalities:
      input:
      - text
      # nothing on the way out. `output` is typed rather than derived, and it is
      # empty on purpose: a probability per option is not a modality a consumer
      # receives, and putting `text` here would land the model in `any to text`
      # beside the language models, which is the claim `kind` exists to avoid
      output: []
    turns:
      source: mradermacher/decider-4b-GGUF
      developer: rejected
      leading_system_max: 1
      mid_system: rejected
      mid_developer: rejected
    thinking:
      knob: enable_thinking
      kind: boolean
      default: true
  # CARRIED AS A BASE, not as a candidate. qwen3 8b is two generations behind the
