  prism-ml/Ternary-Bonsai-2-27B-gguf:
    kind: text
    # ternary weights are what it was trained to, not what it was reduced to
    native_low_bpw: true
    # prism published this release as gguf and mlx and nothing else: there is no
    # unpacked repo to key it on the way the 1.0 entries are, so the geometry
    # below comes off the card rather than off a config.json
    gguf_only: true
    name:
      short: bonsai 2 27b
      match: (?:ternary[\s-]*)?bonsai[\s-]*2(?![\d.])(?:[\s-]*27b)?\b
    notes: 'the 2 generation, and a different base model from the 1.0 entries beside it:
      those derive from qwen3.6-27b and this one from qwen3.8-27b, which the card {card}
      states -- "Derived from Qwen3.8-27B, a 27B hybrid-attention causal language model
      (architecture unchanged)". what is new in the format is a rotation: each matrix is
      transformed blockwise by a hadamard before the ternary assignment and the runtime
      applies the matching transform to activations, which the card says is declared in the
      file so "a runtime either applies the matching transform or refuses to load the file".
      prism reports 84.78 against the bf16 base''s 86.32 over fourteen benchmarks in thinking
      mode, which is their own measurement and the only one anybody has published. the same
      table is the sharpest published statement of what low-bit failure looks like: their
      IQ2_XXS comparison arm holds 88.93 on mmlu-redux while falling to 57.5 on aime26 and
      56.4 on livecodebench, so a casual test of it reads fine and a reasoning chain does not.
      what an entry costs when nobody publishes weights is visible here: the parameter count
      is read off the repo NAME rather than a config, so the card''s own 27.36b reads as the
      27b the name spells and every derived bits-per-weight runs about a percent high, and
      the attention geometry is missing altogether, which is why this row can say what it
      weighs and not what a cache beside it would cost. the window itself is not guessed -- it
      comes out of the gguf header and agrees with the 262k the card claims.'
    quants:
    - repo: prism-ml/Ternary-Bonsai-2-27B-gguf
      quant: PTQ1_0
      file: Ternary-Bonsai-2-27B-PTQ1_0.gguf
      note: 'the dense packing at {gib}, which is the one to take where memory is tight: the
        card {card} calls it "1.75" bits per weight against PQ2_0''s "2.13" for the same
        weights, the difference being that PQ2_0 "stores each trit in a 2-bit slot" for
        cheaper unpacking. neither is uniformly faster and the card measures both on nine
        platforms -- PTQ1_0 wins decode on the ada-generation cards and the L4, PQ2_0 on
        hopper, ampere and blackwell, and PQ2_0 wins prompt processing everywhere. NEITHER
        LOADS ON A STOCK BUILD: see the runtime block'
      runtime:
        mainline: false
        fork: https://github.com/PrismML-Eng/llama.cpp
        note: 'the ternary hybrid-attention kernels are the fork''s, and the card {card} is
          unusually precise about the failure mode: stock llama.cpp "rejects `PQ2_0` and
          `PTQ1_0` as unknown types, and it loads `Q2_0` without any warning and produces
          garbage, because it has no Hadamard activation runtime". so the two rungs here fail
          loudly and the Q2_0 build in the `-gguf-dev` repo beside them fails silently, which
          is why this entry pins neither of those and why prism names that file
          `Ternary-Bonsai-2-27B-Q2_0-prism-fork-required.gguf`'
    - repo: prism-ml/Ternary-Bonsai-2-27B-gguf
      quant: PQ2_0
      file: Ternary-Bonsai-2-27B-PQ2_0.gguf
      note: the same weights in the packing that unpacks cheaper, {gib} against
        {gib@Ternary-Bonsai-2-27B-PTQ1_0.gguf}, and the one prism measured on apple
        silicon
      runtime:
        mainline: false
        fork: https://github.com/PrismML-Eng/llama.cpp
        note: 'the same fork and the same reason as the rung above: a stock build rejects
          this type by name'
    - repo: prism-ml/Ternary-Bonsai-2-27B-gguf
      quant: F16
      note: the reference build at {gib}, which is what the ternary rungs are measured
        against rather than something to serve
    runtime:
      arch: qwen35
      mainline: true
      since: b7990
      merged: '2026-02-10'
    sampling:
      thinking:
        source: tuned-here
        temp: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repeat_penalty: 1.0
        note: 'the card {card} publishes these and says where they came from: "These match
          the base model''s own `generation_config.json` and are the values carried in the
          GGUF metadata (`general.sampling.*`), so a client that reads model defaults will
          use them without being told." they are also the settings its benchmark table was
          run at'
        tuned:
        - instruct
        - chat
        - reason
        - code
        - tools
    ids:
      aa: ''
      gbench: ''
      lmarena: ''
      swerebench: ''
      epoch: ''
    modalities:
      input:
      - text
      - image
      output:
      - text
    turns:
      source: prism-ml/Ternary-Bonsai-2-27B-gguf
      developer: rejected
      leading_system_max: 1
      mid_system: rejected
      mid_developer: rejected
    thinking:
