    notes: 'released 2026-09-10, and measured by its own card {card} alone -- "All base
      models are evaluated in our internal framework". a 552b causal encoder-decoder -- 8b
      active in prefill, 16b in decode -- beside a 196b engram lookup table the backbone count leaves out, so the
      checkpoint is 763b of parameters in total. the release ships NO jinja chat template: the
      vendor''s prompt format is a python reference encoder in `encoding/` on the base repo.
      `turns:` and `thinking:` below are derived anyway, off a template vcruz305 wrote into
      its own gguf header, because that is the one a consumer serving these files actually
      runs. the two disagree wherever both have an answer, and the vendor''s side is MEASURED
      rather than read off a card: encoding.py runs, so the same probe conversations analyze-
      chat-templates renders were encoded through it. it raises on a developer message where
      the template takes it as a user turn, and it takes a mid-conversation system message
      through its own `<|System|>` token where the template reorders it to the front. both
      keep four leading system messages. the vendor selects thinking with a `thinking_mode`
      argument of `chat` or `thinking` rather than a boolean, and its effort knob takes an int
      in [1, 100] as well as `low`, `high` and `max`, which map to 50, 75 and 100. the
      template has neither shape: it gates on `enable_thinking` and reacts to a
      `reasoning_effort` of `max` alone, ignoring every other name, which is why one level is
      accepted below and no default is stated. no unsloth conversion exists yet.'
    quants:
    - repo: apetersson/DeepSeek-V4.1-Flash-MixedQ2-GGUF
      quant: IQ2_XXS-mixed
      file: DSV41-mixedq2.gguf
      runtime:
        mainline: false
        tracking: https://github.com/ggml-org/llama.cpp/pull/28696
        note: the derived block below reads the header, which says `deepseek4` -- the v4
          architecture mainline has carried since b9840 -- and that is the one case where the
          header is not the answer. this file was converted before the architecture got its own
          name, and a v4.1 file ships no `output_hc_*` tensors, so a stock build accepts the
          arch string and then fails on the tensor table. the quantizer's own matrix records the
          same result from the other side, and says the file has not been run end to end on ANY
          runtime
      note: 'the smallest pack of this model and the cheapest thing that loads: {gib} over five
        shards at {bpw}, sha256 covered and byte-reproducible over two runs per the card {card}.
        a routed-expert requant rather than a rung -- iq2_xxs on gate/up and q2_k on down,
        against native precision everywhere else -- so the label carries `-mixed` the way
        avar6''s does. it is uncalibrated (no imatrix, unit importance) and it omits the two
        engram tables, the mtp/dspark blocks and the vision tensors, which is why the vision
        half of this entry is a fact about the checkpoint and not about this file -- and it is
        why every pack below it carries the engram tables and costs half again as much at the
        least. this was
        carried as the pin while it was the only complete pack on the hub; it is the smallest
        now, and {gib@vcruz305/DeepSeek-V4.1-Flash-GGUF:Q2_K} is the smallest that keeps the
        engram. AMAImedia mirrors vcruz305''s shards beside the original safetensors and is not
        a second source of anything'
    - repo: vcruz305/DeepSeek-V4.1-Flash-GGUF
      quant: Q2_K
      runtime:
        mainline: false
        tracking: https://github.com/ggml-org/llama.cpp/pull/28696
        note: 'the v4.1 runtime gap, which is the same one the pin above hits. the second reason
          this rung once carried is gone -- llama.cpp reads `split.count` and refuses a split it
          cannot complete, and the pack is whole now. the card says it outright, "These files do
          not run on upstream llama.cpp yet" {card}, and names where they do: the
          `runtime/deepseek41` branch of vcruz305''s own llama.cpp fork, with sparse attention
          the piece still unfinished. the upstream PR is where the fork came from rather than a
          separate attempt at it -- the branch and the PR are the same author, and the PR has
          since grown a runtime graph and a chat template on top of the conversion it opened
          with, which is what "still unmerged" now means'
      note: 'carried to track the ladder, because it is the plain k-quant ladder of this model --
        the other packs are recipes. the pack is complete now, at {gib}, and the ladder has grown
        to four
        rungs -- Q3_K_M at {gib@Q3_K_M}, Q4_K_M at {gib@Q4_K_M} and Q8_0 at {gib@Q8_0}, an order
        above the pin beside it, so this entry is a watch rather than an offer. the rung
        below Q2_K that the card announces does not exist -- the card
        {card} announces q2_k_m and q5_k_m, neither of which has landed, and what is here is
        plain q2_k (`general.file_type` 10). a Q1_0 rung was published and withdrawn between
        sweeps. the header no longer agrees with the pin above: this pack was redone under
        `deepseek41`, the name the upstream PR gives the architecture, and the apetersson file is
        the one left declaring `deepseek4`'
    - repo: smalinin/DeepSeek-V4.1-Flash-GGUF
      quant: Q2_K-mixed
      file: Q2_K_Protected-Q8
      runtime:
        mainline: false
        fork: https://github.com/smalinin/llama.cpp
        branch: my_build_deepseek41
        note: 'the card {card} claims no upstream: the files "require the linked
          `my_build_deepseek41` branch", and the branch is CUDA only. it is a fourth fork of
          llama.cpp rather than one of the others'' branch, and the card pins the conversion to
          one commit of that checkout rather than to a release, which is the practical
          difference: the working build here is a checkout and a hash'
      note: 'the newest of five rungs, on a ladder built by keeping the engram tables UP while
        the backbone goes down: the smallest rung takes the tables to Q5_K and this one to Q8_0,
        which is why a file whose largest single type is Q2_K weighs {gib} at {bpw}. the card
        {card} calls it faster rather than merely smaller than the rung it replaces -- routed
        `gate` and `up` off IQ2_XXS onto Q2_K and `down` off Q2_K onto Q3_K, "inspired by" but
        explicitly not a requantization of antirez''s DwarfStar release. three of the five rungs
        including this one are calibrated with a published 262,144-token imatrix, which is more
        than the apetersson pack above carries, and `Q2_K_Protected` is the publisher''s own name
        for the recipe, which is what the file key is. this is also the only pack here with a
        vision projector sitting beside the rungs, at {gib@mmproj:BF16}, and the same card says it
        is not wired up: "the checkpoint''s vision tower is not mapped into these GGUF files"'
    - repo: mxxm-t/DeepSeek-V4.1-Flash-GGUF
      quant: MXFP4
      runtime:
        mainline: false
        fork: https://github.com/mxxm-t/mx-llama.cpp
        note: 'built for mx-llama.cpp, which is a fork of llama.cpp and not a branch of one:
          the card {card} names tensor parallelism (`-sm tensor`) with a custom AllReduce and
          prebuilt ROCm and CUDA images, and says the model runs there under both `-sm layer`
          and `-sm tensor`. nothing upstream loads these bytes'
      note: 'the pack carrying the drafter this entry advertises, and the most literal of the
        four: the released MXFP4 expert blocks repacked rather than requantized, which the tensor
        table reads as {bpw} with 99% of the file still MXFP4, over {gib}. the engram tables are
        one shard apiece and the card {card} is blunt about where they have to live -- they are
        read at random during prompt processing, and moving them from a SATA pool to NVMe
        "roughly doubles prompt processing". text only: no vision tower and no projector. the
        dspark sidecar beside it holds the three mtp draft stages and the dspark heads and is
        "not a standalone model"'
    - repo: JigSawPT/DeepSeek-V4.1-Flash-GGUF
      quant: MXFP4
