  meta-models/Muse-Glimmer-30B:
    kind: text
    # "Muse Glimmer supports the following levels: low / medium / high / xhigh"
    # -- the card, which is the only place they are written down. the template
    # only defaults reasoning_strength to 'high' and validates nothing.
    thinking:
      knob: reasoning_strength
      accepts: [low, medium, high, xhigh]
      default: high
    name:
      short: muse glimmer
      match: muse[\s-]*glimmer|\bglimmer\b
    quants:
    - repo: unsloth/Muse-Glimmer-30B-GGUF
      quant: Q8_0
    speculative:
      type: draft-dflash
      n_max: 15
      note: dflash denoises a 16-token block in place and yields at most block_size-1, so
        llama.cpp's default of 3 leaves most of it unused
    sampling:
      thinking:
        source: generation-config
        temp: 1.0
        top_p: 0.95
        top_k: 64
        min_p: 0.1
        presence_penalty: 0.0
        repeat_penalty: 1.0
        tuned:
        - instruct
        - chat
        - reason
        - code
        - tools
    notes: 'the only model here whose thinking knob is `reasoning_strength` rather than enable_thinking
      or reasoning_effort. llama.cpp #26941 translates reasoning_effort to it, so a client
      that speaks the common knob works against a recent build and silently does nothing against
      an older one.'
    ids:
      aa: muse-glimmer
      gbench: meta/muse-glimmer-30b
      lmarena: muse-glimmer
      swerebench: ''
      epoch: ''
    modalities:
      input:
      - text
      - image
      - video
      output:
      - text
    turns:
      source: unsloth/Muse-Glimmer-30B-GGUF
      developer: dropped
      leading_system_max: unlimited
      mid_system: ok
      mid_developer: dropped
  microsoft/Fara1.5-27B:
    kind: text
    name:
      short: fara 1.5 27b
