    - repo: mradermacher/Qwen3.5-4B-Base-GGUF
      quant: Q8_0
      # keyed by filename for the same reason the decider's rung is
      file: Qwen3.5-4B-Base.Q8_0.gguf
      note: the static ladder. there is no unsloth repo and no MTP build of a
        pretrain, so no UD rungs and no drafter -- and a base model has nothing to
        draft, since nothing here scores one
