        branch: dsv41-porte
        note: 'the third fork of this model, and the one that says out loud why the three do
          not generalize: "it runs only on the `dsv41-porte` branch", and upstream''s PR
          "stores the engram tables differently, so this file is not interchangeable with
          files from that converter" {card}. when the PR lands this rung does not land with it'
      note: 'the rung for a reader who wants no requantization at all rather than a cheaper
        file: "the routed experts are a lossless repack of the released MXFP4 blocks", the dense
        weights dequantized from fp8 into Q8_0 and BF16, and the two engram tables carried as
        their raw fp8 bytes with their scales {card} -- which is why the tensor table calls a
        quarter of this file I8 rather than any quant, at {bpw} over {gib}: the largest rung this
        entry pins. text only by its own admission -- the converter on that branch skips the
        vision tower, and the card says so in those words rather than letting the `image` in the
        modalities below stand for the file'
    ids:
      aa: deepseek-v4-1-flash
      gbench: deepseek/deepseek-v4.1-flash
      lmarena: ''
      swerebench: ''
      epoch: deepseek-v4.1-flash
    runtime:
      arch: deepseek4
      mainline: true
      since: b9840
      merged: '2026-06-29'
      note: 'the derived block is what the headers say rather than what loads, and the headers
        this entry reads now disagree with each other. four of the five packs declare
        `deepseek41`, which mainline has no entry for at all -- it is the name the open PR
        registers -- and the fifth declares `deepseek4`, the string above, which mainline has
