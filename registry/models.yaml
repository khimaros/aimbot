        own fork, so a consumer on a stock build gets the 8x larger file or nothing
    - repo: prism-ml/Ternary-Bonsai-8B-gguf
      quant: Q2_0
      runtime:
        mainline: false
        fork: PrismML-Eng/llama.cpp
        branch: prism
      note: 'carried to record WHY the pin above is the 8x larger file, and the reason changed
        without the conclusion changing. mainline gained a `Q2_0` at b9913 on 2026-07-07, so
        "the type does not exist upstream" stopped being true -- but mainline''s is QK2_0 64,
        an 18-byte block over 64 weights, and prism''s is the g128 its card describes, 34 bytes
        over 128. same type NAME, different block layout, so a stock build reads the tensor
