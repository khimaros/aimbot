  # CARRIED AS A BASE, for the same reason qwen3 8b beside it is. this is the
  # pretrain `Mapika/decider-4b` was fine-tuned from, and a derivative whose base
  # is not carried cannot be read against the thing it claims to improve on --
  # which is the whole question a decision model raises, since the claim is that
  # one forward pass of a 4b beats a prompted 4b at naming an option.
  Qwen/Qwen3.5-4B-Base:
    kind: text
    name:
      short: qwen3.5-4b-base
      match: qwen\s*-?3\.5[\s-]*\b4b[\s-]*base\b
    notes: >-
      the qwen3.5 4b pretrain: same 32 layers, same 8-fulls-24-linear attention
      geometry and the same 262144 context as the qwen3.5-4b above it, with no
      post-training under it. it is here as a base rather than as a candidate --
      nobody should serve a raw pretrain off this roster today -- and it is the
      base `Mapika/decider-4b` names, the way qwen3 8b below is there for ternary
      bonsai. the hub calls it image-text-to-text and mradermacher's conversion
      agrees, but the tower ships in a separate `mmproj-Q8_0` file: every rung of
      the main ladder is text weights alone, which is why its `modalities` are
      checked against a config that carries a vision block and not against a file
      a consumer would have to pair up.
