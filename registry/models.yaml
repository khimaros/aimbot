  # VIDEO. `kind: video` is new and it is a claim about the OUTPUT rather than
  # about the loader: these run on the same stable-diffusion.cpp binary as the
  # image entries above and emit frames instead of a picture. it exists for the
  # reason `kind: diarize` and `kind: post` do -- without it a model that emits
  # a clip sits in the image roster looking like something that answers `draw
  # me a picture`, and every image-board percentile would be computed against
  # models no image board scores.
  #
  # none of the three is scored by anything. artificial analysis and lmarena
  # both rate text-to-image and neither publishes a video board this repo
  # collects, so `ids` carries the image keys empty rather than inventing new
  # ones for boards that do not exist here yet.
