  # what crispasr runs BESIDE a transcript. three shapes and they are not
  # interchangeable:
  #
  #   translate   a real `--backend`, in the feature matrix, that takes text in
  #               and emits text in another language
  #   post        punctuation and language id, which the README lists as rows
  #               and the matrix does NOT carry: they are flags over a finished
  #               transcript rather than backends. `crispasr.post` names the job
  #               the way `crispasr.diarize` does for the embedders, and
  #               `kind: post` is what stops a punctuation model sitting in the
  #               speech roster looking like something to transcribe with
  #   s2s         audio in, audio out: restoration rather than recognition
  #
  # none carries a `modalities:` block, for the reason the diarizers do not.
  # these run inside crispasr's pipeline; a reader does not send them a prompt,
  # and declaring text in / text out would put a punctuation restorer in the
  # `any to text` roster beside the language models.
  facebook/m2m100_418M:
    kind: translate
    name:
      short: m2m100
      match: \bm2m[\s-]*100\b(?![\s-]*wmt)
    notes: >-
      100 languages any-to-any, which is what "any" means here: it translates
      between pairs without routing through english, unlike the wmt21 pair
      below.
    quants:
    - repo: cstr/m2m100-418m-GGUF
      quant: Q8_0
      role: model
      crispasr:
        backend: m2m100
  facebook/wmt21-dense-24-wide-en-x:
    kind: translate
    name:
      short: m2m100-wmt21
      match: wmt[\s-]*21
    notes: >-
      english to seven languages, and the direction is baked into the weights --
      meta ship a separate `x-en` checkpoint for the way back, which crispasr
      names under the same backend. this entry pins the `en-x` half and carries
      the other as a component, because they are two files of one job rather
