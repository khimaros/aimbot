        source: tuned-here
        temp: 0.0
        tuned: [base, fim]
        note: the card {card} publishes no sampling set -- it is the architecture's
          card, and there is no generation_config.json beside the weights either --
          so greedy is what this registry chose rather than a set anybody
          documented. `base` is the whole of what a pretrain is tuned for, and the
          reason this row is here at all
    modalities:
      input:
      - text
      - image
      - video
      output:
      - text
    turns:
