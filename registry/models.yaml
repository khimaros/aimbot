  # CARRIED WITH NO QUANTS. crispasr's README names only the vendor's own repo
  # for each of these -- no cstr conversion exists and `fetch-gguf-sizes` finds
  # no gguf in the repo itself -- so there is no rung a consumer could select.
  # the `crispasr:` block sits on the MODEL rather than a quant for the same
  # reason: it is a fact about the architecture, and with no file to attach it
  # to there is nothing narrower to say. most of these carry crispasr's
  # `auto-download` capability, which is the binary fetching the weights itself
  # rather than loading something from this roster.
  # CARRIED BECAUSE A BOARD ALREADY SCORES THEM. every entry below arrives with
  # a number rather than needing one: the open ASR leaderboard publishes a word
  # error rate against a huggingface repo id, and artificial analysis rates the
  # two synthesis models. that is the opposite of how most of this roster was
  # filled -- the models above were added because an engine loads them and then
  # mostly turned out to be scored by nobody.
  #
  # three of them share a crispasr backend with a model already carried, which
  # is why they were left out when the roster grew by engine coverage: a sibling
  # under one `--backend` was a row with nothing to say. a WER changes that.
  HojoAI/Hojo-ASR-V1:
    kind: speech
    name:
      short: hojo-asr-v1
      match: hojo[\s-]*asr
    notes: >-
      second on the open ASR leaderboard at 4.33 mean WER over eight datasets,
      behind qwen3-asr-1.7b and ahead of everything this roster carried before
      it. apache 2.0. no conversion exists and crispasr names no backend, so it
      is tracked rather than servable -- the number is the reason it is here.
    ids:
      aa-stt: ''
      aa-stt-streaming: ''
      aa-tts: ''
      tts-arena: ''
      voicearena: ''
      open-asr: HojoAI/Hojo-ASR-V1
    modalities:
      input:
      - text
      - audio
      output:
      - text
