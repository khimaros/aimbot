# the source of truth for model facts, keyed by huggingface base repo.
#
# the repo IS the name. an invented short name is a second thing to keep in sync,
# and llama-tools grew four separate short-name tables before this file existed.
#
# WHAT BELONGS HERE: facts a human had to establish and a machine cannot fetch --
# which quant to prefer and why, the sampling numbers a vendor recommends,
# capability tags, the ids each benchmark source invented.
#
# WHAT DOES NOT: anything derivable. parameter counts, gguf byte sizes, native
# context, architecture, mtp presence and which thinking knob a chat template
# accepts are fetched into data/model-facts.json and joined by the same key.
#
# WHAT ALSO DOES NOT: host policy, including the name a consumer serves it
# under. which of these to run, as what, at what context, is the consumer's.
#
# seeded from the pre-split llama-tools llama-swap config; prose notes are
# hand-written.
#
# a quant's `quant:` is what the rung IS -- `Q8_0`, `F16`, `UD-Q4_K_XL` -- and
# `file:` is what it is CALLED where a repo does not name its files after the
# tag. whisper.cpp publishes `ggml-large-v3-turbo-q8_0.bin` and kokoro's
# converter publishes `Kokoro_espeak_Q8.gguf`, neither of which a size table
# keyed by tag can find, and putting the filename in `quant:` made the ladder
# read as a list of filenames beside every other model's list of quants. the
# consumer already split them by hand -- llama-tools serves that whisper rung as
# `whisper-large-v3-turbo:FP16` -- so the split belongs here.
#
# `engine:` is the list of RUNTIMES that load a model's weights, and it is here
# rather than derived because a gguf does not say what wrote it. two of them are
# derived and are not written down: llama.cpp when `runtime.arch` names an
# architecture it carries, and crispasr when a `crispasr:` block names a backend.
# the rest have to be established -- kokoro's gguf is a TTS.cpp conversion and
# loads in nothing else, whisper's files are whisper.cpp's own, z-image is one of
# the two dozen architectures stable-diffusion.cpp detects -- so they are written
# on the model with the reason in its notes. a model with no runtime at all
# leaves the field off, which is a fact worth carrying: it is the difference
# between weights this roster can run and weights it can only point at.

