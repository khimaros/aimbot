      two conversions of one checkpoint, and they are not interchangeable. the
      card {card} describes "the **0.6B CustomVoice** variant, based on the
      **12Hz** tokenizer" supporting "9 premium timbres". both conversions carry
      the same 480 talker tensors, but the khimaros conversion namespaces
      its metadata `qwen3-tts` where crispasr reads `qwen3tts`, and its codec is
