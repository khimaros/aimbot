  # what crispasr runs BESIDE a transcript. three shapes and they are not
  # interchangeable:
  #
  #   translate   a real `--backend`, in the feature matrix, that takes text in
  #               and emits text in another language
  #   post        punctuation and language id, which the README lists as rows
  #               and the matrix does NOT carry: they are flags over a finished
  #               transcript rather than backends. `crispasr.post` names the job
  #               the way `crispasr.diarize` does for the embedders, and
  #               `kind: post` is what stops a punctuation model sitting in the
  #               speech roster looking like something to transcribe with
  #   s2s         audio in, audio out: restoration rather than recognition
  #
  # none carries a `modalities:` block, for the reason the diarizers do not.
  # these run inside crispasr's pipeline; a reader does not send them a prompt,
  # and declaring text in / text out would put a punctuation restorer in the
  # `any to text` roster beside the language models.
  facebook/m2m100_418M:
    kind: translate
    name:
      short: m2m100
      match: \bm2m[\s-]*100\b(?![\s-]*wmt)
    notes: >-
      100 languages any-to-any, which is what "any" means here: it translates
      between pairs without routing through english, unlike the wmt21 pair below.
      the card {card} states the shape, "a multilingual encoder-decoder
      (seq-to-seq) model trained for Many-to-Many multilingual translation".
    quants:
    - repo: cstr/m2m100-418m-GGUF
      quant: Q8_0
      role: model
      crispasr:
        backend: m2m100
  facebook/wmt21-dense-24-wide-en-x:
    kind: translate
    name:
      short: m2m100-wmt21
      match: wmt[\s-]*21
    notes: >-
      english to seven languages, and the direction is baked into the weights:
      the card {card} calls it "a 4.7B multilingual encoder-decoder (seq-to-seq)
      model trained for one-to-many multilingual translation", and meta ship a
      separate `x-en` checkpoint for the way back, which crispasr
      names under the same backend. this entry pins the `en-x` half and carries
      the other as a component, because they are two files of one job rather
      than two rungs of one model.
    quants:
    - repo: cstr/wmt21-dense-24-wide-en-x-GGUF
      quant: Q8_0
      role: model
      crispasr:
        backend: m2m100-wmt21
    components:
    - repo: cstr/wmt21-dense-24-wide-x-en-GGUF
      quant: Q8_0
      role: reverse-direction
  google/madlad400-3b-mt:
    kind: translate
    name:
      short: madlad
      match: madlad
    notes: >-
      419 languages, the widest coverage of anything in this registry in any
      modality -- omnivoice's 600+ is synthesis and omniasr's is recognition;
      this is translation. the card {card} gives the architecture as "a
      multilingual machine translation model based on the T5 architecture". the repo also ships a `-ref` diff-harness file, which
      is not a rung and is named nowhere here. it takes no chat template: the
      target language is a `<2xx>` token in front of the source sentence, such as
      `<2de>` for german.
    quants:
    - repo: cstr/madlad400-3b-mt-GGUF
      quant: Q8_0
      role: model
      crispasr:
        backend: madlad
  sarulab-speech/sidon-v0.1:
    kind: speech
    name:
      short: sidon
      match: \bsidon\b
    notes: >-
      not recognition and not synthesis: it takes 16 kHz mono in and emits
      restored 48 kHz mono -- a research artefact rather than a product, which
      the card {card} is candid about, crediting "project gamma of the National
      Institute of Advanced Industrial Science and Technology" -- so it is the one entry in the speech roster whose
      job is to repair audio rather than to read or write it. crispasr carries
      one other backend of that shape, `voxcpm2-vae`, against the VoxCPM2
      weights this roster already holds for synthesis.
    quants:
    - repo: KevinAHM/Sidon-GGUF
      quant: F16
      role: model
      crispasr:
        backend: sidon
    ids:
      aa-stt: ''
      aa-stt-streaming: ''
      aa-tts: ''
      tts-arena: ''
      voicearena: ''
    modalities:
      input:
      - audio
      output:
      - audio
  cis-lmu/glotlid:
    kind: post
    name:
      short: glotlid-v3
      match: glotlid
    notes: >-
      language identification over a transcript, and the broadest of the three
      here. apache 2.0, which the card {card} states as "the Apache License,
      Version 2.0 plus notices". crispasr applies it as a step rather than a backend, which is why
      this carries `crispasr.post` and no `--backend` name exists for it.
    quants:
    - repo: cstr/glotlid-GGUF
      quant: Q8_0
      role: model
    crispasr:
      post: language-id
  # NOT CARRIED: `cld3` and `lid-176`, crispasr's other two language-id steps.
  # both exist on the hub only as cstr's conversion -- cld3's upstream is a C++
  # library and fasttext's lid.176 ships as a `.bin` from fasttext.cc -- so the
  # only key available for either is a gguf repo, which `make lint` rejects and
  # should: the key is what every capture joins on, and pointed at a conversion
  # all of them answer about the converter.
  #
  # `facebook/fasttext-language-identification` is on the hub and is NOT the
  # upstream of lid-176: it identifies 217 languages where lid.176 does 176, so
  # keying on it would assert a lineage that is not there. glotlid-v3 above
  # covers the same job with a real upstream, which is why losing these two
  # costs the roster a duplicate rather than a capability.
  oliverguhr/fullstop-punctuation-multilang-large:
    kind: post
    name:
      short: fullstop-punc
      match: fullstop[\s-]*punc
    notes: >-
      punctuation restoration, and the card {card} is narrower than "several
      languages" suggests -- it "predicts the punctuation of English, Italian,
      French and German texts". the key is a rename the hub reports and
      `resolve-base` flags -- `fullstop-punctuation-multilang-
      large` does not look like `fullstop-punc-multilang` -- and the rename is
      real, which is why that flag reports rather than filters. hyphens and colons
      are where it is weakest, since they "in many cases, are optional and can be
      substituted by either a comma or a full stop" {card}. punctuate-all covers
      twelve languages to this one's four, on a smaller backbone.
    quants:
    - repo: cstr/fullstop-punc-multilang-GGUF
      quant: Q8_0
      role: model
    crispasr:
      post: punctuation
  kredor/punctuate-all:
    kind: post
    name:
      short: punctuate-all
      match: punctuate[\s-]*all
    notes: 'punctuation restoration; the smaller alternative to fullstop-punc above, on a
      base-size backbone "instead of an xlm-roberta-large and on twelve languages instead of
      four" {card}, so it covers more languages with less model. its own confusion matrix
      shows what the size costs: half of the true dashes come out as commas, and nearly a
      third of the colons as full stops.'
    quants:
    - repo: cstr/punctuate-all-GGUF
      quant: Q4_K
      role: model
    crispasr:
      post: punctuation
  FireRedTeam/FireRedPunc:
    kind: post
    name:
      short: fireredpunc
      match: fire[\s-]*red[\s-]*punc
    notes: >-
      xiaohongshu's punctuation model, from the team behind the firered-asr
      entry above -- its card {card} is the shared one for "an all-in-one ASR
      system with ASR, VAD, LID, and Punc modules", of which this is the last. its conversion is the only one in the post set with an
      imatrix rung, and it ships an untagged `fireredpunc.gguf` beside the
      tagged ones -- which the pin does NOT name: it is `quant: Q8_0`, and the
      untagged file is a second copy the size table keys separately.
    quants:
    - repo: cstr/fireredpunc-GGUF
      quant: Q8_0
      role: model
    crispasr:
      post: punctuation
