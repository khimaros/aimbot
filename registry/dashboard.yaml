# what the dashboard opens with, and what its sliders are made of.
#
# SOURCE, not output. these are decisions -- what "quality" means, how much of
# a box to hold back for the runtime, how far up a quant ladder is worth
# climbing -- and they were spread across two implementations: the weights in
# `scripts/build-viewer`, the rest as `const DEFAULT_*` inside
# `scripts/viewer.html`. neither is a place a reader of this registry would
# look, and a judgement in code is a judgement nobody reviews.
#
# `scripts/build-viewer` reads this file into `docs/data.json`, the page reads
# it from there, and `scripts/aimbot` gets the same values through the same
# module. there is one copy.
version: 1

# the composite: what the balanced ranking means, by facet key.
#
# a facet nothing weights produces no score, and a roster that ranks 70 models
# and shows a dash beside the other 19 reads as "unmeasured" when the
# measurement exists -- so the speech and image keys are weighted here for the
# same reason the text ones are. they cost the text ranking nothing: no text
# model carries one, and the composite's denominator is the weight it actually
# used.
#
# the two artificial analysis keys carried the coding and agentic INDICES until
# the site retired both. the facets are named for evals now, so these name
# evals -- scicode for writing code and terminal-bench 2.1 for driving a
# terminal -- chosen over the alternatives on roster coverage: an axis the
# composite has to impute for most of the roster moves ranks on absence rather
# than on evidence. livecodebench scores 5 of the 46 models artificial analysis
# rates here and terminal-bench 4.0 scores 29 with 14 of them at exactly zero,
# so both are carried at no weight until the boards fill in.
weights:
  aa.scicode: 0.30
  aa.terminalbench: 0.30
  gbench.agentic: 0.15
  lmarena.rating: 0.10
  swerebench.resolved: 0.10
  community.*: 0.05
  card.*: 0.05
  # the open asr leaderboard carries the transcription half at more depth than
  # anything else here -- 19 of the roster's models against artificial
  # analysis' 5, over eight datasets rather than one index -- so it takes the
  # larger share of the transcription weight
  open-asr.accuracy: 0.40
  aa-stt.accuracy: 0.30
  aa-tts.elo: 0.30
  tts-arena.elo: 0.20
  # the wildcard, not us english: weighting one language would rank a model on
  # the slice it happens to be tuned for
  voicearena.*: 0.20
  # generation is what the image roster is ranked ON, so the three boards that
  # rate it share the weight evenly. two of them are preference elos and the
  # showdown is a pass rate against written criteria, and there is no honest
  # basis here for calling either kind the better evidence -- they disagree, and
  # carrying them at one weight each is what says so.
  #
  # editing is carried at zero on both boards that rate it: real numbers about a
  # real capability, and a DIFFERENT question, so they show on the model and a
  # reader who wants them ranked moves the slider. giving them weight by default
  # would quietly redefine what the image score means
  aa-t2i.elo: 0.34
  lmarena-t2i.rating: 0.33
  showdown-t2i.adherence: 0.33
  lmarena-edit.rating: 0.0
  showdown-edit.adherence: 0.0
  # the decision roster, weighted for the same reason the speech and image keys
  # are: a facet nothing weights produces no score. two axes, because a model
  # whose entire output is a confidence has to be ranked on both halves of being
  # right -- picking the right option, and knowing which ones it gets wrong.
  #
  # `jev.score` is NOT weighted: two of its four axes are Speed and Cost, and for
  # an open model those are the evaluator's own GPU with a x2 + 0.15s self-host
  # adjustment, which is a fact about a pod and not about the weights. `jev.hard`
  # and `jev.sealed` are carried for a reader to look at and rank on nothing, the
  # way image editing is: they are slices of the same 842 decisions, and weighting
  # a slice alongside the whole moves the rank for the shape of the question set
  jev.intelligence: 0.60
  jev.calibration: 0.40

# the named weightings the page offers, each a whole answer to "what is
# quality" rather than a nudge. `base: true` starts from `weights:` above;
# `drop_prefixes` removes the facet families it names from that copy.
#
# A LIST BECAUSE THE ORDER IS THE POINT: `default` first, then the two
# questions people actually ask, then the two that say where a ranking came
# from. as a mapping it reached the page alphabetically -- the payload is
# written with sorted keys -- and MODELS.md's sensitivity table opened on
# `agentic and tool use` as though that were the house answer.
presets:
- k: default
  title: balanced ranking
  base: true
- k: coding
  title: writing code
  weights:
    aa.scicode: 0.4
    gbench.oneshot: 0.2
    swerebench.resolved: 0.25
    card.*: 0.05
    community.reddit-localllama: 0.1
- k: agentic
  title: agentic and tool use
  weights:
    aa.terminalbench: 0.4
    aa.tau2: 0.15
    gbench.agentic: 0.3
    community.reddit-localllama: 0.15
- k: measured
  title: third-party measurement only
  base: true
  drop_prefixes: [card, community]
- k: community
  title: what people report
  weights:
    community.reddit-localllama: 0.5
    community.hackernews: 0.2
    community.hf-discussions: 0.2
    community.level1techs: 0.1
- k: clear
  title: nothing weighted
  weights: {}

# the box a reader is assumed to have until they say otherwise. the reserve is
# not decoration: the kv cache grows with the context served and the compute
# buffers are not free either, which is why 12 of a 128 is held back.
hardware:
  budget: 128
  reserve: 12
  minCtx: 131072
  cap: q8
  floor: none
  bandwidth: 256
  flops: 60

# how far up the quant ladder the fit may climb, as a bits-per-weight ceiling.
# past q8 the extra bytes buy nothing measurable and cost decode speed, so a
# box with room to spare gets the fastest quant that is still lossless-ish
# rather than bf16 because it happened to fit.
# a null ceiling is no ceiling. yaml's `.inf` would reach the page as the
# literal `Infinity`, which is not json and which JSON.parse refuses.
caps:
- {k: none, bpw: null, label: up to bf16}
- {k: q8, bpw: 11, label: max q8}
- {k: q6, bpw: 7.5, label: max q6}
- {k: q5, bpw: 6.2, label: max q5}
- {k: q4, bpw: 5.3, label: max q4}

# a floor rather than a ceiling: below it the answer is "not with this much
# memory" rather than a two-bit version of the model.
floors:
- {k: none, bpw: 0, label: any quant}
- {k: q2, bpw: 2.4, label: min q2}
- {k: q3, bpw: 3.2, label: min q3}
- {k: q4, bpw: 4.2, label: min q4}
- {k: q5, bpw: 5.3, label: min q5}
- {k: q6, bpw: 6.2, label: min q6}
- {k: q8, bpw: 7.5, label: min q8}

# what the page opens filtered to, and ONLY that. MODELS.md's ranking blocks
# are generated by booting the page, which used to make this the document's
# roster as well -- change a ui default and the document rewrote itself.
# `research/dashboard-table` pins what it ranks now, modality and flags both, so
# these are a reader's starting point and nothing else. filtering on the licence
# here is what finished the job: it drops seven text models the document is
# still about.
filters:
  modalities: [text]
  flags: [fits]
  # which of registry/licenses.yaml's tiers the page opens showing: ALL of them,
  # so nothing is hidden on licence grounds until a reader asks. the control is
  # for narrowing -- "what could i ship under", "which are unclassified" -- and
  # those are questions a reader asks, not answers to give them unprompted.
  #
  # it defaulted to `permissive` alone for one afternoon and the cost was
  # concrete: 16 text models gone, including most of the frontier open-weights
  # tier -- qwen3.8 flash next, kimi k3, minimax m3 and m2.5, nemotron super,
  # mistral medium, solar open2 -- and four of those on `unknown`, which is
  # nobody here having read the terms rather than a finding against them. a
  # roster that silently omits the best models it knows about is answering a
  # question nobody asked.
  #
  # LISTED rather than left empty, even though an empty set is also no filter:
  # the menu then shows three ticked boxes a reader can untick, instead of
  # nothing ticked and a button claiming everything. the cost of listing is that
  # a FOURTH tier added to licenses.yaml would be hidden until it is named here
  # too -- build-viewer rejects a tier named here that the table does not
  # declare, but it cannot reject the reverse without forbidding a narrow default
  licenses: [permissive, restricted, unknown]
  # the runtimes that load most of this roster and that a reader here is likely
  # to have built. a multi-select because a model can have two -- whisper's
  # files load in crispasr and in stock whisper.cpp
  engines: [llama.cpp, crispasr, stable-diffusion.cpp]

# every column in the order the table lists them, and which of them start
# hidden. a reader wants a stance before sixty decisions, so most of the
# per-source columns are one click away rather than on screen.
columns:
  order: [rank, short, kind, repo, license, params, active, experts, spec, pp,
          tg, ctx, extctx, fitctx, quant, bpw, think, profiles, size, kv,
          evidence, scicode, tbench, gbench, swe, arena, score, langs, bestfor,
          community, downloads]
  hidden: [kind, repo, license, params, active, experts, spec, pp, tg, ctx,
           extctx, bpw, think, profiles, kv, scicode, tbench, gbench, swe,
           arena, langs, bestfor, community, downloads]

# the menus behind the two speed estimates, and how much of the paper figure a
# real decode actually reaches. both estimates are arithmetic and never a
# measurement, which is why they are shown with a `~` and no percentile bar.
speed:
  bandwidth_efficiency: 0.65
  flops_efficiency: 0.35
  # f16 keys and values, llama.cpp's default
  kv_bytes: 2
  bandwidths:
  - {value: 0, label: no bandwidth}
  - {value: 90, label: 90 gb/s dual ddr5}
  - {value: 205, label: 205 gb/s m4 pro}
  - {value: 256, label: 256 gb/s strix halo}
  - {value: 273, label: 273 gb/s dgx spark}
  - {value: 546, label: 546 gb/s m4 max}
  - {value: 819, label: 819 gb/s m3 ultra}
  - {value: 1008, label: 1008 gb/s rtx 4090}
  - {value: 1792, label: 1792 gb/s rtx 5090}
  flopses:
  - {value: 0, label: no compute}
  - {value: 20, label: 20 tflops fp16}
  - {value: 60, label: 60 tflops strix halo}
  - {value: 120, label: 120 tflops fp16}
  - {value: 165, label: 165 tflops rtx 4090}
  - {value: 400, label: 400 tflops fp16}
  - {value: 990, label: 990 tflops rtx 5090}

# the runtimes a snippet can be written for, and whether each one loads gguf.
# `roles:` is the flag a COMPONENT of that role travels under, per runtime.
#
# THIS PAGE IS THE ONLY CONSUMER and is expected to stay that way. it moved out
# of the page to be shared with llama-tools, who declined it and were right to:
# a flag spelling is a property of the BINARY a host runs, not of a model, so
# two consumers CAN reasonably disagree -- the same `codec` role under
# Breeze-TTS-2.cpp takes a different flag or none. by this registry's own test
# that makes it policy rather than a fact, and it is here because config beats
# 24 string literals in a template, not because it is a contract.
#
# the bar for ever publishing it as a fact is captured `--help` output per
# runtime under `research/data/`. hand-written, one copy per consumer is right.
#
# a role absent from a runtime's map is NOT an error and not a gap to fill by
# guessing. the command names the file as a comment instead, which is the honest
# output for a flag nobody here has evidence for -- `uncond` is sd.cpp's case,
# and the seven crispasr companions below it are the rest.
#
# `--codec-model` is absent from crispasr's README, which reads as a gap in the
# README rather than a weak flag: it is in 14 cstr cards, three of them as an
# explicit `| --codec-model PATH |` parameter row, and llama-tools pins it. do
# not argue anything from its provenance.
#
# three of the six codec components ship in the model's OWN repo, where dia's
# card says the file is "auto-discovered beside the model" and the flag defaults
# to `auto`. naming it there is redundant rather than wrong -- it pins the same
# file the discovery would find -- which is the opposite of the `--mmproj` case,
# where naming it SUPPRESSED a working auto-download. so it is emitted for all
# six and the distinction costs nothing.
runtimes:
- {k: llama.cpp, gguf: true}
- {k: vllm, gguf: false}
- k: crispasr
  gguf: true
  roles: {codec: --codec-model}
- {k: whisper.cpp, gguf: true}
- k: stable-diffusion.cpp
  gguf: true
  roles: {vae: --vae, llm: --llm}
- {k: TTS.cpp, gguf: true}
- {k: Breeze-TTS-2.cpp, gguf: true}
